name: Documentation

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6

      - uses: actions/checkout@v6

      - name: Create site directory
        run: mkdir -p site

      - name: Copy R Language Tutorials (HTML)
        run: |
          echo "📚 Copying R Language Tutorials..."
          
          if [ -d "R语言与生信分析/R语言" ]; then
            mkdir -p "site/R语言教程"
            
            # Copy all HTML files
            cp "R语言与生信分析/R语言/001R语言基础/R语言基础.html" \
               "site/R语言教程/" 2>/dev/null
            cp "R语言与生信分析/R语言/002R语言数据清洗与预处理/R语言数据清洗与预处理.html" \
               "site/R语言教程/" 2>/dev/null
            cp "R语言与生信分析/R语言/003R语言与数据可视化/R语言与数据可视化.html" \
               "site/R语言教程/" 2>/dev/null
            cp "R语言与生信分析/R语言/004R语言统计分析/R语言统计分析.html" \
               "site/R语言教程/" 2>/dev/null
            cp "R语言与生信分析/R语言/005R语言统计与建模/R语言统计与建模.html" \
               "site/R语言教程/" 2>/dev/null
            cp "R语言与生信分析/R语言/006R语言与机器学习/R语言与机器学习（上）.html" \
               "site/R语言教程/" 2>/dev/null
            cp "R语言与生信分析/R语言/006R语言与机器学习/R语言与机器学习（下）.html" \
               "site/R语言教程/" 2>/dev/null
            cp "R语言与生信分析/R语言/007R语言与深度学习/R语言与深度学习（上）.html" \
               "site/R语言教程/" 2>/dev/null
            
            R_COUNT=$(find "site/R语言教程" -name "*.html" | wc -l)
            echo "   ✅ Copied $R_COUNT R tutorial files"
          fi

      - name: Copy Bioinformatics Documentation (Sphinx HTML)
        run: |
          echo "🔬 Copying Bioinformatics Documentation..."
          
          if [ -d "R语言与生信分析/生物信息技术/_build/html" ]; then
            mkdir -p "site/bio"
            
            # Copy all bioinformatics content
            cp -r "R语言与生信分析/生物信息技术/_build/html"/* "site/bio/" 2>/dev/null
            
            BIO_COUNT=$(find "site/bio" -name "*.html" | wc -l)
            echo "   ✅ Copied $BIO_INFO files"
          fi

      - name: Set Sphinx-style homepage
        run: |
          echo "📖 Setting up Sphinx-style homepage..."
          
          # Use bioinformatics index.html as main page (Sphinx style)
          if [ -f "site/bio/index.html" ]; then
            cp "site/bio/index.html" "site/index.html"
            echo "   ✅ Using Sphinx documentation as homepage"
          else
            echo "   ⚠️ Fallback: creating simple index"
            cat > site/index.html << 'EOF'
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>医学生逃亡计划</title>
</head>
<body>
<div role="main">

<h1>医学生逃亡计划</h1>

<p>R语言与生信分析完整教程</p>

<div class="section" id="r-language-tutorials">
<h2><a class="toc-backref" href="#id1">R语言教程</a></h2>
<ul class="simple">
<li><a class="reference internal" href="R语言教程/R语言基础.html">R语言基础</a></li>
<li><a class="reference internal" href="R语言教程/R语言数据清洗与预处理.html">数据清洗与预处理</a></li>
<li><a class="reference internal" href="R语言教程/R语言与数据可视化.html">数据可视化</a></li>
<li><a class="reference internal" href="R语言教程/R语言统计分析.html">统计分析</a></li>
<li><a class="reference internal" href="R语言教程/R语言统计与建模.html">统计建模</a></li>
<li><a class="reference internal" href="R语言教程/R语言与机器学习（上）.html">机器学习（上）</a></li>
<li><a class="reference internal" href="R语言教程/R语言与机器学习（下）.html">机器学习（下）</a></li>
<li><a class="reference internal" href="R语言教程/R语言与深度学习（上）.html">深度学习</a></li>
</ul>
</div>

<div class="section" id="bioinformatics">
<h2><a class="toc-backref" href="#id2">生物信息技术</a></h2>
<ul class="simple">
<li><a class="reference internal" href="bio/index.html">完整文档索引</a></li>
</ul>
</div>

</div>
</body>
</html>
EOF
          fi

      - name: Verify deployment
        run: |
          echo ""
          echo "========================================="
          echo "Deployment Summary"
          echo "========================================="
          
          if [ -f "site/index.html" ]; then
            TOTAL_HTML=$(find site -name '*.html' | wc -l)
            echo "✅ Homepage: Ready (Sphinx style)"
            echo "📊 Total HTML files: $TOTAL_HTML"
            echo ""
            echo "Content:"
            find site -maxdepth 2 -name "*.html" -type f | head -15
          else
            echo "❌ ERROR: No homepage found"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - uses: actions/deploy-pages@v5
        id: deployment

      - name: Deployment complete
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "📍 URL: ${{ steps.deployment.outputs.page_url }}"
          echo "📖 Style: reStructuredText + Sphinx"
