# ============================================================
# VitePress 站点构建并部署到 GitHub Pages
# 仓库：XTSgreen/medical_student_rescue_plan
# 部署 URL：https://xtsgreen.github.io/medical_student_rescue_plan/
# 参考：https://vitepress.dev/guide/deploy#github-pages
# ============================================================

name: Deploy VitePress site to Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# 允许 GitHub Pages 部署所需权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只允许一次部署，避免并发覆盖
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ---------- 构建任务 ----------
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 启用 lastUpdated 时间戳所需完整历史

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm  # 缓存 npm 依赖加速构建

      - name: Install dependencies
        run: npm ci

      - name: Build with VitePress
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  # ---------- 部署任务 ----------
  deploy:
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
