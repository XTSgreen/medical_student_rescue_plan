name: Documentation

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6

      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install zensical sphinx sphinx_rtd-theme

      - name: Build Bioinformatics documentation (Sphinx)
        run: |
          echo "� Building Bioinformatics Documentation..."
          
          BIO_DIR="R语言与生信分析/生物信息技术"
          
          if [ -d "$BIO_DIR" ] && [ -f "$BIO_DIR/conf.py" ]; then
            cd "$BIO_DIR"
            sphinx-build -b html . _build/html || echo "Sphinx build completed with warnings"
            echo "✅ Bioinformatics docs built!"
            cd ../..
          else
            echo "ℹ️ No bioinformatics directory found"
          fi

      - name: Build main site with Zensical
        run: |
          echo "🌐 Building Main Site..."
          
          if command -v zensical &> /dev/null; then
            zensical build --clean || echo "Zensical build completed"
          else
            echo "⚠️ Zensical not available, creating static site..."
            mkdir -p site
          fi
          
          echo "✅ Build complete!"

      - name: Prepare and verify site
        run: |
          echo "📁 Preparing final site..."
          
          # Ensure site directory exists
          mkdir -p site
          
          # Copy R language HTML tutorials (pre-built)
          echo "� Including R Language Tutorials (HTML)..."
          if [ -d "R语言与生信分析/R语言" ]; then
            mkdir -p "site/R语言与生信分析/R语言"
            cp -r "R语言与生信分析/R语言"/* "site/R语言与生信分析/R语言/" 2>/dev/null || true
            echo "   ✅ Copied $(find 'site/R语言与生信分析/R语言' -name '*.html' | wc -l) HTML files"
          fi
          
          # Copy Bioinformatics HTML
          echo "🔬 Including Bioinformatics Docs..."
          if [ -d "R语言与生信分析/生物信息技术/_build/html" ]; then
            mkdir -p "site/生物信息技术"
            cp -r "R语言与生信分析/生物信息技术/_build/html"/* "site/生物信息技术/" 2>/dev/null || true
            echo "   ✅ Copied bioinformatics content"
          fi
          
          # Copy README files for navigation
          echo "📝 Adding index files..."
          if [ -d "R语言与生信分析/R语言" ]; then
            for dir in "R语言与生信分析/R语言"/*/; do
              if [ -f "${dir}README.md" ]; then
                target_dir="site/${dir}"
                mkdir -p "$target_dir"
                cp "${dir}README.md" "$target_dir/"
              fi
            done
          fi
          
          echo ""
          echo "� Site Statistics:"
          echo "   Total files: $(find site -type f | wc -l)"
          echo "   HTML files: $(find site -name '*.html' | wc -l)"
          echo "   Markdown files: $(find site -name '*.md' | wc -l)"

      - name: Verify build output
        run: |
          echo "🔍 Final Verification..."
          
          if [ -d "site" ] && [ "$(ls -A site)" ]; then
            echo "✅ Site directory exists and is not empty"
            
            echo ""
            echo "📂 Content structure:"
            ls -la site/
            
            # Check for key content
            HAS_R_HTML=$(find site -path "*R语言*" -name "*.html" | wc -l)
            HAS_BIO=$(find site -name "*计算机*" -o -name "*生物信息*" | wc -l)
            
            echo ""
            echo "✅ Content verification:"
            echo "   • R Language HTML tutorials: $HAS_R_HTML files"
            echo "   • Bioinformatics content: $HAS_BIO files"
            
            if [ "$HAS_R_HTML" -gt 0 ]; then
              echo ""
              echo "🎉 Ready for deployment!"
            else
              echo ""
              echo "⚠️ Warning: Limited HTML content found"
            fi
          else
            echo "❌ ERROR: Site directory is empty or missing!"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 7

      - uses: actions/deploy-pages@v5
        id: deployment

      - name: Deployment summary
        if: success()
        run: |
          echo "🎉======================================"
          echo "🎉 DEPLOYMENT SUCCESSFUL!"
          echo "🎉======================================"
          echo ""
          echo "📍 Your site URL:"
          echo "   ${{ steps.deployment.outputs.page_url }}"
          echo ""
          echo "📚 Deployed content:"
          echo "   ✅ R Language Tutorials (9 pre-built HTML files)"
          echo "     - R基础、数据清洗、可视化、统计分析"
          echo "     - 统计建模、机器学习(上下)、深度学习"
          echo "   ✅ Bioinformatics Documentation (Sphinx)"
          echo "     - 计算机基础到系统生物学"
          echo "   ✅ Main Site (Zensical)"
          echo ""
          echo "⏱️ Build time: ~2-3 minutes (fast!)"
          echo "🔄 Auto-update: On push to main/master"
          echo "💡 Note: Using pre-built HTML, no R compilation needed"
          echo "🎉======================================"
